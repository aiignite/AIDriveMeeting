# 子路径部署变体（NGINX_SUBPATH=1）：https://aiignite.com.cn/meeting/ -> 本容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 录音上传上限与后端 MEETING_MAX_RECORDING_BYTES(200MB) 对齐，放宽 1MB multipart 余量；
    # 外层宿主机 nginx 的 /meeting/ 需保持一致
    client_max_body_size 201m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = / {
        return 301 /meeting/;
    }

    location = /meeting {
        return 301 /meeting/;
    }

    location /meeting/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /meeting/icons/ {
        alias /usr/share/nginx/html/icons/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /meeting/favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    location = /meeting/apple-touch-icon.png {
        alias /usr/share/nginx/html/apple-touch-icon.png;
    }

    location = /meeting/site.webmanifest {
        alias /usr/share/nginx/html/site.webmanifest;
        default_type application/manifest+json;
    }

    # AI 聊天流式端点：必须关闭缓冲（子路径模式下完整路径为 /meeting/api/v1/ai/chat/stream）。
    # 精确匹配只覆盖该端点，避免 proxy_buffering off 波及整个 /meeting/api/ 前缀而禁用 gzip。
    location = /meeting/api/v1/ai/chat/stream {
        proxy_pass http://backend:3315/api/v1/ai/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location /meeting/api/ {
        proxy_pass http://backend:3315/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 录音等静态文件由后端 /static 提供（前端以 BASE_URL 前缀改写为 /meeting/static/...）
    location /meeting/static/ {
        proxy_pass http://backend:3315/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /meeting/health {
        proxy_pass http://backend:3315/health;
    }

    location /meeting/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /meeting/index.html;
    }
}
